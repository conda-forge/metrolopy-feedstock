{% set name = "metrolopy" %}
{% set version = "1.1.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 08773ee5221dc7cefaf7885af0ed4960529c3a4fe58f9b0088287aaae9da4c6d

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python >=3.10
    - uv-build
  run:
    - numpy >=1.25.0
    - matplotlib-base >=3.1.2
    - pandas >=0.25.2
    - python >=3.10
    - scipy >=1.3.2
    - ipython >=7.9.0
    - odrpack >=0.5.0
    - lazy_loader >=0.5

test:
  imports:
    - metrolopy
    - metrolopy.tests
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://nrc-cnrc.github.io/MetroloPy
  summary: 'tools for dealing with measured quantities: uncertainty propagation and unit conversion'
  description: |
    A pure python package with tools for handling first order and Monte-Carlo
    propagation of uncertainty; handles relative, absolute, and expanded
    uncertainties of quantities with units.
  license: GPL-3.0-only
  license_file: LICENSE
  doc_url: https://nrc-cnrc.github.io/MetroloPy
  dev_url: https://github.com/nrc-cnrc/Metrolopy

extra:
  recipe-maintainers:
    - hvparks
